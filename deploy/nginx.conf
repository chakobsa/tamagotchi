# Pet Park web app — nginx server block. Copy to /etc/nginx/sites-available/petpark,
# link it into sites-enabled, set server_name, then: sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d petpark.example.com   (adds the 443 block for you)
server {
    listen 80;
    listen [::]:80;
    server_name petpark.example.com;          # ← your domain (or the VPS IP)

    root /var/www/petpark;                    # ← where you rsync the webapp/ folder
    index index.html;

    # It's a static site: every page is index.html (+ files). No server code, no database.
    location / { try_files $uri $uri/ /index.html; }

    # config.js changes when you redeploy the park: never cache it. Everything else: short cache.
    location = /config.js { add_header Cache-Control "no-store" always; include /etc/nginx/snippets/petpark-headers.conf; }
    location ~* \.(js|css|svg)$ { add_header Cache-Control "public, max-age=300" always; include /etc/nginx/snippets/petpark-headers.conf; }

    include /etc/nginx/snippets/petpark-headers.conf;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
