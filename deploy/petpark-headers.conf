# Security headers for the Pet Park app. Copy to /etc/nginx/snippets/petpark-headers.conf
# connect-src lists the blockchain RPCs the browser talks to. If you set a custom rpc in config.js,
# add its origin here too.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://mainnet.optimism.io https://optimism-rpc.publicnode.com https://base-rpc.publicnode.com https://mainnet.base.org https://rpc.xdcrpc.com https://erpc.xinfin.network https://rpc1.xinfin.network https://rpc.gnosischain.com https://forno.celo.org https://forno.celo-sepolia.celo-testnet.org; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
